server {
    listen 80;
    server_name localhost;

    # Host App
    location / {
        root /usr/share/nginx/html/host;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Promotions remote (Module Federation). Use root + try_files, not alias + try_files:
    # alias + try_files breaks resolution for hashed .js chunks → "Failed to fetch" on dynamic import().
    location /promotions/ {
        root /usr/share/nginx/html;
        try_files $uri =404;

        # Robust CORS configuration
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Proxy for API calls (to Gateway)
    location /api/ {
        proxy_pass ${GATEWAY_URL};
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host ${GATEWAY_HOST};
        proxy_cache_bypass $http_upgrade;
    }
}
