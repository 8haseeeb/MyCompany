# Required GitHub Secrets: ACR_PASSWORD, AZURE_CREDENTIALS, SQL_CONNECTION_STRING_SSO,
# SQL_CONNECTION_STRING_PROMOTIONS, JWT_SECRET (same value for Gateway/SSO/Promotions),
# APPINSIGHTS_CONNECTION_STRING (Azure Application Insights), REDIS_CONNECTION_STRING (Azure Cache for Redis).
name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_NAME: xtelpromoacr
  RESOURCE_GROUP: xtel-promo-rg
  ACA_ENV: xtel-promo-env
  LOCATION: southeastasia
  DOMAIN: yellowplant-40f27ff8.southeastasia.azurecontainerapps.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      # Build and push labels
      - name: Set Image Tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      # Build and push images
      - name: Build and push images
        run: |
          # SSO API
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/sso-api:${{ env.IMAGE_TAG }} -f SSO.Api/Dockerfile .
          docker push ${{ env.ACR_NAME }}.azurecr.io/sso-api:${{ env.IMAGE_TAG }}
          
          # Promotions API
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/promotions-api:${{ env.IMAGE_TAG }} -f Promotions.Api/Dockerfile .
          docker push ${{ env.ACR_NAME }}.azurecr.io/promotions-api:${{ env.IMAGE_TAG }}
          
          # API Gateway
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/api-gateway:${{ env.IMAGE_TAG }} -f MyCompany.ApiGateway/Dockerfile .
          docker push ${{ env.ACR_NAME }}.azurecr.io/api-gateway:${{ env.IMAGE_TAG }}
          
          # WebApp
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/webapp:${{ env.IMAGE_TAG }} -f MyCompany.WebApp/Dockerfile MyCompany.WebApp
          docker push ${{ env.ACR_NAME }}.azurecr.io/webapp:${{ env.IMAGE_TAG }}

      # Deploy SSO API
      - name: Deploy SSO API
        env:
          ACR_PWD: ${{ secrets.ACR_PASSWORD }}
          SQL_SSO: ${{ secrets.SQL_CONNECTION_STRING_SSO }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APPINSIGHTS: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
          REDIS: ${{ secrets.REDIS_CONNECTION_STRING }}
        run: |
          if [ -z "$ACR_PWD" ]; then echo "Error: ACR_PASSWORD secret is empty"; exit 1; fi
          if [ -z "$SQL_SSO" ]; then echo "Error: SQL_CONNECTION_STRING_SSO secret is empty"; exit 1; fi
          if [ -z "$JWT_SECRET" ]; then echo "Error: JWT_SECRET secret is empty"; exit 1; fi
          if [ -z "$APPINSIGHTS" ]; then echo "Error: APPINSIGHTS_CONNECTION_STRING secret is empty"; exit 1; fi
          if [ -z "$REDIS" ]; then echo "Error: REDIS_CONNECTION_STRING secret is empty"; exit 1; fi
          az containerapp up \
            --name sso-api \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --environment "${{ env.ACA_ENV }}" \
            --image "${{ env.ACR_NAME }}.azurecr.io/sso-api:${{ env.IMAGE_TAG }}" \
            --target-port 8080 \
            --ingress external \
            --registry-server "${{ env.ACR_NAME }}.azurecr.io" \
            --registry-username "${{ env.ACR_NAME }}" \
            --registry-password "$ACR_PWD" \
            --env-vars ASPNETCORE_ENVIRONMENT=Production ConnectionStrings__DefaultConnection="$SQL_SSO" ConnectionStrings__Redis="$REDIS" JwtSettings__Secret="$JWT_SECRET" ApplicationInsights__ConnectionString="$APPINSIGHTS"

      # Deploy Promotions API
      - name: Deploy Promotions API
        env:
          ACR_PWD: ${{ secrets.ACR_PASSWORD }}
          SQL_PROMO: ${{ secrets.SQL_CONNECTION_STRING_PROMOTIONS }}
          SQL_SSO: ${{ secrets.SQL_CONNECTION_STRING_SSO }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APPINSIGHTS: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
          REDIS: ${{ secrets.REDIS_CONNECTION_STRING }}
        run: |
          if [ -z "$SQL_PROMO" ]; then echo "Error: SQL_CONNECTION_STRING_PROMOTIONS secret is empty"; exit 1; fi
          if [ -z "$SQL_SSO" ]; then echo "Error: SQL_CONNECTION_STRING_SSO secret is empty"; exit 1; fi
          if [ -z "$JWT_SECRET" ]; then echo "Error: JWT_SECRET secret is empty"; exit 1; fi
          if [ -z "$APPINSIGHTS" ]; then echo "Error: APPINSIGHTS_CONNECTION_STRING secret is empty"; exit 1; fi
          if [ -z "$REDIS" ]; then echo "Error: REDIS_CONNECTION_STRING secret is empty"; exit 1; fi
          az containerapp up \
            --name promotions-api \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --environment "${{ env.ACA_ENV }}" \
            --image "${{ env.ACR_NAME }}.azurecr.io/promotions-api:${{ env.IMAGE_TAG }}" \
            --target-port 8080 \
            --ingress external \
            --registry-server "${{ env.ACR_NAME }}.azurecr.io" \
            --registry-username "${{ env.ACR_NAME }}" \
            --registry-password "$ACR_PWD" \
            --env-vars ASPNETCORE_ENVIRONMENT=Production ConnectionStrings__DefaultConnection="$SQL_PROMO" ConnectionStrings__SsoConnection="$SQL_SSO" ConnectionStrings__Redis="$REDIS" JwtSettings__Secret="$JWT_SECRET" ApplicationInsights__ConnectionString="$APPINSIGHTS"

      # Deploy API Gateway
      - name: Deploy API Gateway
        env:
          ACR_PWD: ${{ secrets.ACR_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APPINSIGHTS: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
        run: |
          if [ -z "$JWT_SECRET" ]; then echo "Error: JWT_SECRET secret is empty"; exit 1; fi
          if [ -z "$APPINSIGHTS" ]; then echo "Error: APPINSIGHTS_CONNECTION_STRING secret is empty"; exit 1; fi
          az containerapp up \
            --name api-gateway \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --environment "${{ env.ACA_ENV }}" \
            --image "${{ env.ACR_NAME }}.azurecr.io/api-gateway:${{ env.IMAGE_TAG }}" \
            --target-port 8080 \
            --ingress external \
            --registry-server "${{ env.ACR_NAME }}.azurecr.io" \
            --registry-username "${{ env.ACR_NAME }}" \
            --registry-password "$ACR_PWD" \
            --env-vars ASPNETCORE_ENVIRONMENT=Production SSO_URL="https://sso-api.${{ env.DOMAIN }}" PROMOTIONS_URL="https://promotions-api.${{ env.DOMAIN }}" JwtSettings__Secret="$JWT_SECRET" ApplicationInsights__ConnectionString="$APPINSIGHTS"



      # Deploy WebApp
      - name: Deploy WebApp
        env:
          ACR_PWD: ${{ secrets.ACR_PASSWORD }}
        run: |
          az containerapp up \
            --name webapp \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --environment "${{ env.ACA_ENV }}" \
            --image "${{ env.ACR_NAME }}.azurecr.io/webapp:${{ env.IMAGE_TAG }}" \
            --target-port 80 \
            --ingress external \
            --registry-server "${{ env.ACR_NAME }}.azurecr.io" \
            --registry-username "${{ env.ACR_NAME }}" \
            --registry-password "$ACR_PWD" \
            --env-vars GATEWAY_URL="https://api-gateway.${{ env.DOMAIN }}" GATEWAY_HOST="api-gateway.${{ env.DOMAIN }}"




