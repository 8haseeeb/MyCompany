version: '3.8'

services:


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=MyPass@123
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "MyPass@123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- SSO API ----
  sso-api:
    build:
      context: .
      dockerfile: SSO.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=SSOIdentityDb;User Id=sa;Password=MyPass@123;TrustServerCertificate=True;Encrypt=False;
    ports:
      - "5253:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  # ---- Promotions API ----
  promotions-api:
    build:
      context: .
      dockerfile: Promotions.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=PromotionsDb;User Id=sa;Password=MyPass@123;TrustServerCertificate=True;Encrypt=False;
      - ConnectionStrings__SsoConnection=Server=sqlserver,1433;Database=SSOIdentityDb;User Id=sa;Password=MyPass@123;TrustServerCertificate=True;Encrypt=False;
    ports:
      - "5137:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  # ---- API Gateway ----
  api-gateway:
    build:
      context: .
      dockerfile: MyCompany.ApiGateway/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - SSO_URL=http://sso-api:8080
      - PROMOTIONS_URL=http://promotions-api:8080
    ports:
      - "5000:8080"
    depends_on:
      - sso-api
      - promotions-api

  # ---- Frontend WebApp ----
  webapp:
    build:
      context: MyCompany.WebApp
      dockerfile: Dockerfile
    ports:
      - "5001:80"
      - "5003:5002"
    depends_on:
      - api-gateway

volumes:
  sqldata:
